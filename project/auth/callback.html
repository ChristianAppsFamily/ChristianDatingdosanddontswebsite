<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Signing in…</title>
  <link rel="stylesheet" href="../v2/tokens.css" />
  <link rel="stylesheet" href="../v2/components.css" />
  <link rel="stylesheet" href="../v3/theme.css" />
</head>
<body>
  <div style="
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    padding: 24px; text-align: center;
  ">
    <span class="mono" style="width: 56px; height: 56px; font-size: 18px; border-radius: 28%; display: inline-flex; align-items: center; justify-content: center;">D&amp;D</span>
    <p style="margin: 0; font-family: var(--font-ui); font-size: 16px; color: var(--text-2);">Signing you in…</p>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="../config.jsx"></script>
  <script type="text/babel">
    (async () => {
      if (!isSupabaseConfigured() || !sb) {
        window.location.replace('/?screen=signup');
        return;
      }
      // Exchange PKCE / hash tokens if present
      try {
        const params = new URLSearchParams(window.location.search);
        if (params.get('code')) {
          await sb.auth.exchangeCodeForSession(window.location.href);
        } else {
          await sb.auth.getSession();
        }
      } catch (e) {
        console.error('[callback]', e);
      }
      const result = await handleOAuthCallback();
      if (!result) {
        window.location.replace('/login');
        return;
      }
      const next = result.hasStage ? 'dashboard' : 'onboarding';
      window.location.replace('/' + (next === 'dashboard' ? 'dashboard' : 'onboarding') + '?oauth=1');
    })();
  </script>
</body>
</html>
